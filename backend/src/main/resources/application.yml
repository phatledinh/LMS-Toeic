server:
  port: 8080


spring:
  application:
    name: LMSToeic
  datasource:
    url: jdbc:mysql://localhost:3306/lms_toeic?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Ho_Chi_Minh&createDatabaseIfNotExist=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    out-of-order: true

jwt:
    secret: ledinhphatjwtsecretkeyHS256hoidanitjwtsecretkeyHS256hoidanitjwt
    #1000d
    access-token-expiration: 86400000000
    #7d
    refresh-expiration: 604800000